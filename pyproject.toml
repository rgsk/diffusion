[project]
name = "diffusion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.6",
]

[tool.ruff]
src = ["src"]                 # so forward_process, unet, ... sort as first-party
extend-exclude = ["*.ipynb"]  # walkthroughs are scratch, not linted
