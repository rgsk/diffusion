[project]
name = "diffusion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    # <7: ipykernel 7 reworked the kernel async/status protocol and the
    # current VS Code Jupyter ext (2025.9.1) can miss the reply that ends
    # a cell -- outputs land but the spinner never resolves, needing a reload
    "ipykernel>=6.29,<7",
    "ruff>=0.16.6",
]

[tool.ruff]
src = ["src"]                 # so forward_process, unet, ... sort as first-party
